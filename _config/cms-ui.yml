---
Name: silvershop-cms-ui
---
# v1 is CSS-only: the stylesheet is loaded CMS-wide but every rule is gated behind an opt-in class
# (.ss-grid / .ss-panel*), so a form that does not use the primitives is untouched. No JavaScript and
# no LeftAndMain extension are needed (the collapsible-panel JS is deferred to v2).
SilverStripe\Admin\LeftAndMain:
  extra_requirements_css:
    - 'silvershop-suite/cms-ui:client/css/cms-ui.css'
    - 'silvershop-suite/cms-ui:client/css/ss-icons.css'   # Lucide icon webfont -> .ss-icon-* (Phase 1, full set)

---
Name: silvershop-cms-ui-gridfield-status
---
# Status styling for GridFields: adds $grid->addStatusBadges() / colorRowsByStatus() / hideStatusFlags()
# and the updateNewRowClasses row hook to every GridField. Opt-in — inert until a method is called.
SilverStripe\Forms\GridField\GridField:
  extensions:
    - SilverShop\CmsUi\Extensions\GridFieldStatusExtension
